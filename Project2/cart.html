<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="detail.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@latest/css/boxicons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=apparel" />
<body>
    <header>
        <div class="logoText">
        <a href="home.html" class="logo"><img src="image/PLMUN.logo.png" alt=""></a>
            
            <div class="text">
                <h2>Pamantasan ng Lungsod <br>ng Muntinlupa</h2>
                <h5>ONLINE SHOP</h5>
            </div>
            
        </div>
        <div class="nav-icon">
            <a href="product.html"><i class="bx bx-shopping-bag"></i></a>
            <a href=""><i class='bx bx-user' ></i></a>
        
        </div>
    </header>
    <div class="cart">
            <div class="cart-header">
                <span>Products</span>
                <span>Price</span>
                <span>Quantity</span>
                <span>Total</span>
                <span>Remove</span>
            </div>
        
            <div class="cart-items">
                    <div class="cart-item">
                    <div class="product">
                        <img src="image/apparel_150dp_1F6B3A_FILL0_wght400_GRAD0_opsz48.png" alt="">
                        <div class="item-detail">
                            <p>School Unifrom (Male)</p>
                        <div class="size-color-box">
                            <span class="size"></span>
                        </div>
                    </div>
                </div>
                <span class="price">P500</span>
                <div class="quantity"><input type="number" value="1" min="1"></div>
                <span class="total-price">P500</span>
                <button class="remove"><i class="bx bx-trash"></i></button>
            </div>
        </div>
        <div class="cart-total">
            <h3>Cart Total</h3>
            <p>Subtotal <span class="subtotal">P0</span></p>
            <p>Grand Total <span class="grand-total">P0</span></p>
            <button class="btn">Proceed to Checkout</button>
        </div>
    </div>


    <script src="java.js"></script>
    <script src="products.js"></script>
    <script src="script.js"></script>
    

</body>
</html>
